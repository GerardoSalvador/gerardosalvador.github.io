<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Fiesta de Superhéroes · Batman + Spider-Man</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .hero-card {
            max-width: 600px;
            width: 100%;
            background: #0f0f13;
            border-radius: 64px;
            overflow: hidden;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6), 0 0 0 2px #e23636, 0 0 0 5px #1a1a2e;
        }

        /* Estilos para el contenedor del video */
        .video-container {
            width: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .video-container video {
            width: 100%;
            height: auto;
            display: block;
            aspect-ratio: 9 / 16; /* Para mantener proporción vertical 9:16 */
            object-fit: cover;
        }

        .heroes-showcase {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 30px 25px 20px;
            background: linear-gradient(180deg, #1a1a2e 0%, #0f0f13 100%);
        }

        .hero-single {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 40px;
            padding: 15px;
            backdrop-filter: blur(4px);
        }

        .hero-single:nth-child(2) {
            flex-direction: row-reverse;
            text-align: right;
        }

        .hero-photo {
            width: 140px;
            height: 140px;
            background: #1a1a1a;
            border-radius: 35px;
            overflow: hidden;
            border: 3px solid #e23636;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
            flex-shrink: 0;
        }

        .hero-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero-name {
            color: white;
            font-size: 1.8rem;
            font-weight: 800;
            text-shadow: 2px 2px 0 #e23636;
            letter-spacing: 2px;
        }

        .hero-name span {
            font-size: 0.9rem;
            display: block;
            color: #e23636;
            font-weight: normal;
            text-shadow: none;
        }

        .info-section {
            padding: 25px;
            text-align: center;
            background: #0a0a0c;
        }

        .title {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(95deg, #e23636, #ffffff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 15px;
        }

        .details-box {
            background: #1a1a1f;
            border-radius: 40px;
            padding: 20px;
            margin: 20px 0;
            border-left: 4px solid #e23636;
            border-right: 4px solid #2d2d44;
        }

        .detail-row {
            color: #e0e0e0;
            margin: 12px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 1rem;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 60px;
            font-weight: bold;
            text-align: center;
            transition: all 0.2s;
        }

        .btn-maps {
            background: #1a1a2e;
            border: 1px solid #e23636;
            color: #e23636;
        }

        .btn-wa {
            background: #25D366;
            color: #000;
        }

        .btn:hover {
            transform: scale(0.97);
            filter: brightness(1.05);
        }

        .footer {
            text-align: center;
            padding: 15px;
            font-size: 0.8rem;
            color: #888;
            border-top: 1px solid #222;
        }

        @media (max-width: 550px) {
            .hero-photo { width: 100px; height: 100px; }
            .hero-name { font-size: 1.3rem; }
            .hero-single { gap: 12px; }
        }
    </style>
</head>
<body>
    <div class="hero-card">
        <!-- Video vertical agregado aquí -->
        <div class="video-container">
            <video controls playsinline poster="https://placehold.co/600x1067/1a1a2e/white?text=Dale+a+Play">
                <source src="cumple.mp4" type="video/mp4">
                Tu navegador no soporta el elemento de video.
            </video>
        </div>
        
        <div class="heroes-showcase">
            <div class="hero-single">
                <div class="hero-photo">
                    <img src="https://i.pinimg.com/736x/42/e6/b4/42e6b484930e3bbc330610da34d4648b.jpg" alt="Batman" onerror="this.src='https://placehold.co/140x140/black/white?text=BATMAN'">
                </div>
                <div class="hero-name">BATMAN<br><span>El Caballero de la Noche</span></div>
            </div>
            <div class="hero-single">
                <div class="hero-photo">
                    <img src="https://m.media-amazon.com/images/S/pv-target-images/0c9bdf20b4bc5ba67b9c3628f3b24d8409b9322c3e8ba558c875da0c007f1029._SX1080_FMjpg_.jpg" alt="Spider-Man" onerror="this.src='https://placehold.co/140x140/red/white?text=SPIDERMAN'">
                </div>
                <div class="hero-name">SPIDER-MAN<br><span>El Héroe Vecinal</span></div>
            </div>
        </div>
        <div class="info-section">
            <div class="title">⚡ ¡PODER INFANTIL!⚡</div>
            <div class="details-box">
                <div class="detail-row">🦇 <strong id="kidName">Mauricio</strong> cumple <strong id="kidAge">7</strong> años 🕷️</div>
                <div class="detail-row">📅 <strong id="eventDate">DOMINGO 31 DE MAYO</strong> - <strong id="eventTime">4:00 PM</strong> 📅</div>
                <div class="detail-row">📍 <strong id="eventAddress">CALLE NEPTUNO ED. G, DEPT 01, FRACC. VILLA EL CIELO, VILLAHERMOSA</strong> 📍</div>
            </div>
            <div class="button-group">
                <a href="#" id="mapsBtn" class="btn btn-maps">🗺️ ¿CÓMO LLEGAR?</a>
                <a href="#" id="waBtn" class="btn btn-wa">💬 CONFIRMAR ASISTENCIA</a>
            </div>
        </div>
        <div class="footer">🦸‍♂️ ¡ NO FALTES ! 🦸‍♀️</div>
    </div>

    <script>
        // ========== EDITAR AQUÍ ==========
        const conf = {
            name: "MAURICIO",
            age: "7",
            date: "DOMINGO 31 DE MAYO",
            time: "4:00 PM",
            address: "CALLE NEPTUNO ED. G, DEPT 01, FRACC. VILLA EL CIELO, VILLAHERMOSA",
            mapsUrl: "https://maps.app.goo.gl/tEcDwp8QQwHo4C3Y6",
            waPhone: "529932919089",
            waMsg: "Hola, confirmo mi asistencia a la fiesta de Mauricio 🎉"
        };
        // =================================

        document.getElementById('kidName').innerText = conf.name;
        document.getElementById('kidAge').innerText = conf.age;
        document.getElementById('eventDate').innerText = conf.date;
        document.getElementById('eventTime').innerText = conf.time;
        document.getElementById('eventAddress').innerText = conf.address;
        document.getElementById('mapsBtn').href = conf.mapsUrl;
        document.getElementById('waBtn').href = `https://wa.me/${conf.waPhone}?text=${encodeURIComponent(conf.waMsg)}`;
    </script>
</body>
</html>
